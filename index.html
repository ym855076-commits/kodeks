<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Кодекс Мудрости</title>
<style>
:root{--bg:#0f172a;--tx:#f8fafc;--cd:#1e293b;--bd:#334155;--ac:#fbbf24;--sub:#94a3b8;--in:#0f172a;--ib:#475569}
.light{--bg:#f8fafc;--tx:#0f172a;--cd:#fff;--bd:#e2e8f0;--ac:#d97706;--sub:#64748b;--in:#f1f5f9;--ib:#cbd5e1}
*{box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:15px;transition:background .3s,color .3s}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;background:var(--cd);padding:8px 12px;border-radius:12px;border:1px solid var(--bd)}
.top>div{display:flex;align-items:center;gap:8px}
#net{font-size:12px;color:var(--sub)}
select,input,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid var(--ib);border-radius:8px;font-size:14px;background:var(--in);color:var(--tx);font-family:inherit}
.top select{width:auto;margin:0;padding:5px 8px;font-size:13px}
.top input{width:auto;margin:0}
h1{font-size:20px;margin:0;text-align:center}
.ic{font-size:36px;text-align:center}
button{background:#059669;color:#fff;border:0;padding:12px;width:100%;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer;margin-bottom:8px}
.qd{background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;padding:16px;border-radius:14px;margin:10px 0 15px}
.qd small{font-size:12px;opacity:.9;font-weight:bold;display:block;margin-bottom:6px}
.qd div{font-size:14px;line-height:1.4;font-style:italic}
.box{background:var(--cd);padding:16px;border-radius:14px;margin-bottom:15px;border:2px solid #06b6d4}
.box.qz{border-color:#8b5cf6}
.box.nw{border:1px solid var(--bd);border-left:4px solid #10b981}
.box h3{margin:0 0 8px;font-size:14px;color:#22d3ee}
.box.qz h3{color:var(--tx)}
.box.nw h3{color:#34d399;font-size:16px}
.sub{font-size:12px;color:var(--sub)}
.ar{display:flex;gap:8px;align-items:center}
.ar input{margin:0;flex:1}
.ar button{width:auto;margin:0;padding:11px 16px;background:#0891b2}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:bold;font-size:14px}
#sc{background:#8b5cf6;color:#fff;padding:3px 8px;border-radius:10px;font-size:12px}
#qq{font-size:13px;font-style:italic;margin-bottom:10px}
#qo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qb{background:var(--in);color:var(--tx);border:1px solid var(--ib);padding:8px;font-size:12px;margin:0;font-weight:normal}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.chip{background:var(--cd);color:var(--sub);border:1px solid var(--bd);padding:6px 12px;border-radius:20px;font-size:12px;white-space:nowrap;cursor:pointer;width:auto;margin:0;font-weight:normal}
.chip.on{background:var(--ac);color:#0f172a;font-weight:bold;border-color:var(--ac)}
.card{background:var(--cd);padding:16px;margin-bottom:14px;border-radius:14px;border-left:4px solid var(--ac);border-top:1px solid var(--bd);position:relative}
.card h3{margin:0 0 8px;font-size:16px;color:var(--ac);padding-right:30px}
.card p{margin:0;font-size:14px;line-height:1.5;white-space:pre-line}
.au{font-size:13px;color:var(--sub);margin-top:6px}
.tag{display:inline-block;background:rgba(251,191,36,.15);color:var(--ac);font-size:10px;padding:2px 6px;border-radius:4px;margin-bottom:6px}
.fav{position:absolute;top:12px;right:12px;background:none;width:auto;font-size:20px;padding:0;margin:0}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tb{background:#0284c7;margin:0;padding:6px 12px;font-size:12px;width:auto}
.sp{background:#d97706}.sh{background:#7c3aed}.ed{background:#475569}.del{background:#ef4444}
.bk{display:flex;gap:8px;margin-bottom:15px}
.bk button{background:var(--cd);color:var(--sub);border:1px dashed var(--bd);padding:8px;font-size:12px;margin:0;font-weight:normal}
#inst{display:none;background:#f59e0b;color:#0f172a}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;border:1px solid #475569;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#toast.s{opacity:1}
</style>
</head>
<body>
<div class="top">
 <div><select id="lang"><option value="ru">🇷🇺 Русский</option><option value="tm">🇹🇲 Türkmen</option></select><span id="net"></span></div>
 <div>🌙<input type="checkbox" id="theme">☀️</div>
</div>
<button id="inst"></button>
<div class="ic">📜</div><h1 id="t_title"></h1>
<div class="qd"><small id="t_day"></small><div id="dq"></div></div>

<div class="box">
 <h3 id="t_al"></h3><div class="sub" id="t_ald" style="margin-bottom:8px"></div>
 <div class="ar"><input type="time" id="atime"><button id="abtn"></button></div>
 <div class="sub" id="ast" style="margin-top:6px"></div>
</div>

<div class="box qz" id="quiz">
 <div class="qh"><span id="t_quiz"></span><span id="sc"></span></div>
 <div id="qq"></div><div id="qo"></div>
</div>

<input type="text" id="q">
<div id="chips"></div>
<div class="bk"><button id="exp"></button><button id="imp"></button><input type="file" id="file" accept=".json" style="display:none"></div>

<div class="box nw" id="form">
 <h3 id="t_add"></h3>
 <input type="text" id="title"><input type="text" id="author">
 <textarea id="advice" rows="4"></textarea>
 <select id="cat"></select>
 <button id="save"></button>
</div>

<h2 id="t_list" style="font-size:16px;color:var(--sub)"></h2>
<div id="list"></div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=['Общие','Тишина','Психология','Стратегия','Философия','Личное'];
const L={
ru:{title:'Кодекс Мудрости',day:'💡 Мысль дня',quiz:'🎮 Кто автор мысли?',score:'Очки: ',search:'🔍 Поиск...',all:'🌐 Все',fav:'⭐ Избранное',add:'🚀 Новая мысль',topic:'Тема...',author:'Автор (для викторины)',text:'Текст мысли...',save:'💾 Сохранить',upd:'💾 Обновить',exp:'📥 Бэкап',imp:'📤 Загрузить',list:'📖 База знаний',empty:'Ничего не найдено',delQ:'Удалить?',copied:'Скопировано',al:'⏰ Будильник тишины',ald:'Напомнит замолчать и подумать. Работает, пока приложение открыто.',on:'Включить',off:'Выключить',st0:'Выключен',st1:'Активен на ',pick:'Выбери время',msg:'Время паузы! Меньше слов, больше мысли 🤫',right:'🎉 Верно! +10',wrong:'❌ Правильно: ',bad:'Файл не подходит',ok:'Загружено',offl:'📴 Офлайн',onl:'🟢 Онлайн',inst:'📲 Установить приложение',fill:'Заполни тему и текст',replace:'Заменить текущую базу?',
cats:{Общие:'🌐 Общие',Тишина:'🤫 Тишина и речь',Психология:'💡 Психология',Стратегия:'⚔️ Стратегия',Философия:'🏛 Философия',Личное:'✍️ Личное'}},
tm:{title:'Akyl-paparas Kodeksi',day:'💡 Günüň pikiri',quiz:'🎮 Pikiriň awtory kim?',score:'Upaý: ',search:'🔍 Gözleg...',all:'🌐 Hemmesi',fav:'⭐ Halanýanlarym',add:'🚀 Täze pikir',topic:'Tema...',author:'Awtor (wiktorina üçin)',text:'Pikiriň teksti...',save:'💾 Sakla',upd:'💾 Täzele',exp:'📥 Bekap',imp:'📤 Ýükle',list:'📖 Bilim bazasy',empty:'Hiç zat tapylmady',delQ:'Pozmalymy?',copied:'Göçürildi',al:'⏰ Dymmak budilnigi',ald:'Dymmagy we oýlanmagy ýatladýar. Programma açykka işleýär.',on:'Goş',off:'Öçür',st0:'Öçük',st1:'Işjeň: ',pick:'Wagt saýla',msg:'Duralga wagty! Az gürle, köp pikir et 🤫',right:'🎉 Dogry! +10',wrong:'❌ Dogrusy: ',bad:'Faýl ýaramaýar',ok:'Ýüklendi',offl:'📴 Oflaýn',onl:'🟢 Onlaýn',inst:'📲 Programmany gurnamak',fill:'Tema we teksti dolduryň',replace:'Häzirki bazany çalyşmalymy?',
cats:{Общие:'🌐 Umumy',Тишина:'🤫 Dymmak we söz',Психология:'💡 Psihologiýa',Стратегия:'⚔️ Strategiýa',Философия:'🏛 Pelsepe',Личное:'✍️ Şahsy'}}};
const D={ru:[
{title:'Контроль речи',author:'Юсуп',advice:'Слово — серебро, молчание — золото. Прежде чем сказать лишнее, спроси себя: улучшит ли это тишину?',category:'Тишина',fav:true},
{title:'Восточная мудрость о языке',author:'Восточная мудрость',advice:'Мудрый сначала думает и потом говорит, а глупец сначала говорит и лишь потом думает, почему сболтнул лишнего.',category:'Тишина',fav:true},
{title:'Антихрупкость',author:'Нассим Талеб',advice:'Некоторые вещи от беспорядка портятся, но есть те, что от ударов и хаоса становятся только крепче.',category:'Общие'},
{title:'Психологическое айкидо',author:'Юсуп',advice:'Когда тебя критикуют без повода, ответь: «Спасибо за заботу о моём профессионализме». Это сбивает агрессора.',category:'Психология',fav:true},
{title:'28-й Закон Власти',author:'Роберт Грин',advice:'Сомнения порождают слабость, а смелость сглаживает ошибки. Спокойная уверенность вызывает уважение.',category:'Стратегия',fav:true},
{title:'Стратегия тишины',author:'Сунь-цзы',advice:'Настоящий мастер не кричит о победах до их завершения.',category:'Стратегия'}],
tm:[
{title:'Dymmak we söz',author:'Ýusup',advice:'Söz — kümüş, dymmak — altyn. Köp gürlemekden haýyr ýok, her sözüň manysy bolmaly.',category:'Тишина',fav:true},
{title:'Berklik',author:'Nassim Taleb',advice:'Käbir zatlar tertipsizlikden zaýalanýar, ýöne käbirleri urgulardan has hem berkär.',category:'Общие'},
{title:'Akyl we dil',author:'Gündogar paýhasy',advice:'Akylly ilki oýlanýar, soň gürleýär; samsyk bolsa ilki gürleýär, soň oýlanýar.',category:'Тишина'}]};

let lang=localStorage.getItem('kodeks_lang'),cat='all',cards=[],score=+localStorage.getItem('kodeks_score')||0,qa='',editId=null,alarm=localStorage.getItem('kodeks_alarm')||'';if(!L[lang])lang='ru';
const T=()=>L[lang]||L.ru;
const key=()=>'myMentors_'+lang;

function load(){
 let c;try{c=JSON.parse(localStorage.getItem(key()))}catch(e){}
 if(!Array.isArray(c)||!c.length)c=D[lang];
 cards=clean(c);save();
}
function clean(c){
 let n=Date.now();
 return c.filter(x=>x&&x.title&&x.advice).map((x,i)=>({id:x.id||n+i,title:String(x.title),author:x.author?String(x.author):'',advice:String(x.advice),category:CATS.includes(x.category)?x.category:'Общие',fav:!!x.fav}));
}
function save(){try{localStorage.setItem(key(),JSON.stringify(cards))}catch(e){toast('⚠️ Storage full')}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('s');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('s'),2200)}
function copy(s){(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast(T().copied)).catch(()=>toast('⚠️'))}
function speak(s){if(!('speechSynthesis' in window))return copy(s);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang=lang==='ru'?'ru-RU':'tr-TR';u.rate=.95;speechSynthesis.speak(u)}

function ui(){
 const t=T();
 $('t_title').textContent=t.title;$('t_day').textContent=t.day;$('t_quiz').textContent=t.quiz;$('sc').textContent=t.score+score;
 $('q').placeholder=t.search;$('exp').textContent=t.exp;$('imp').textContent=t.imp;$('t_add').textContent=t.add;
 $('title').placeholder=t.topic;$('author').placeholder=t.author;$('advice').placeholder=t.text;
 $('save').textContent=editId?t.upd:t.save;$('t_list').textContent=t.list;
 $('t_al').textContent=t.al;$('t_ald').textContent=t.ald;$('inst').textContent=t.inst;
 $('cat').innerHTML=CATS.map(c=>`<option value="${c}">${t.cats[c]}</option>`).join('');
 $('chips').innerHTML=[['all',t.all],['fav',t.fav],...CATS.map(c=>[c,t.cats[c]])].map(([k,v])=>`<button class="chip${k===cat?' on':''}" data-c="${k}">${v}</button>`).join('');
 alarmUI();net();
}
function net(){$('net').textContent=navigator.onLine?T().onl:T().offl}
addEventListener('online',net);addEventListener('offline',net);

function render(){
 const q=$('q').value.toLowerCase(),t=T();
 const f=cards.filter(c=>(c.title+c.advice+c.author).toLowerCase().includes(q)&&(cat==='all'||(cat==='fav'?c.fav:c.category===cat)));
 $('list').innerHTML=f.map(c=>`<div class="card" data-id="${c.id}"><button class="fav" data-a="fav">${c.fav?'⭐':'☆'}</button><span class="tag">${esc(t.cats[c.category])}</span><h3>📜 ${esc(c.title)}</h3><p>${esc(c.advice)}</p>${c.author?`<div class="au">— ${esc(c.author)}</div>`:''}<div class="row"><button class="tb sp" data-a="speak">🔊</button><button class="tb" data-a="copy">📋</button><button class="tb sh" data-a="share">📤</button><button class="tb ed" data-a="edit">✏️</button><button class="tb del" data-a="del">🗑</button></div></div>`).join('')||`<p class="sub">${t.empty}</p>`;
}
$('list').onclick=e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const c=cards.find(x=>x.id==b.closest('.card').dataset.id);if(!c)return;
 const a=b.dataset.a,txt=c.title+'\n\n'+c.advice+(c.author?'\n— '+c.author:'');
 if(a==='fav'){c.fav=!c.fav;save();render()}
 else if(a==='del'){if(confirm(T().delQ)){cards=cards.filter(x=>x!==c);save();render();quiz()}}
 else if(a==='edit'){editId=c.id;$('title').value=c.title;$('author').value=c.author;$('advice').value=c.advice;$('cat').value=c.category;$('save').textContent=T().upd;$('form').scrollIntoView({behavior:'smooth'})}
 else if(a==='copy')copy(txt);
 else if(a==='share')navigator.share?navigator.share({title:c.title,text:txt}).catch(()=>{}):copy(txt);
 else speak(c.advice);
};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()};
$('q').oninput=render;

$('save').onclick=()=>{
 const title=$('title').value.trim(),advice=$('advice').value.trim();
 if(!title||!advice)return toast(T().fill);
 const o={title,author:$('author').value.trim(),advice,category:$('cat').value};
 if(editId){const c=cards.find(x=>x.id===editId);if(c)Object.assign(c,o);editId=null}
 else cards.unshift({id:Date.now(),fav:false,...o});
 save();['title','author','advice'].forEach(i=>$(i).value='');$('save').textContent=T().save;render();quiz();dayQ();
};

function dayQ(){
 if(!cards.length)return;
 const c=cards[Math.floor(Date.now()/864e5)%cards.length];
 $('dq').textContent='«'+c.advice+'» — '+(c.author||c.title);
}
function quiz(){
 const pool=cards.filter(c=>c.author),au=[...new Set(pool.map(c=>c.author))];
 $('quiz').style.display=au.length<3?'none':'block';if(au.length<3)return;
 const c=pool[Math.random()*pool.length|0];qa=c.author;
 $('qq').textContent=c.advice;
 const o=[qa,...au.filter(a=>a!==qa).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
 $('qo').innerHTML=o.map(a=>`<button class="qb" data-v="${esc(a)}">${esc(a)}</button>`).join('');
}
$('qo').onclick=e=>{
 const b=e.target.closest('.qb');if(!b)return;
 if(b.dataset.v===qa){score+=10;localStorage.setItem('kodeks_score',score);toast(T().right)}else toast(T().wrong+qa);
 $('sc').textContent=T().score+score;quiz();
};

function alarmUI(){
 const t=T();$('abtn').textContent=alarm?t.off:t.on;$('abtn').style.background=alarm?'#ef4444':'#0891b2';
 $('ast').textContent=alarm?t.st1+alarm+' ⏰':t.st0;$('ast').style.color=alarm?'#22d3ee':'#34d399';
 if(alarm)$('atime').value=alarm;
}
$('abtn').onclick=()=>{
 if(alarm)alarm='';else{if(!$('atime').value)return toast(T().pick);alarm=$('atime').value}
 localStorage.setItem('kodeks_alarm',alarm);alarmUI();
};
setInterval(()=>{
 if(!alarm)return;
 const d=new Date(),n=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 if(n!==alarm)return;
 alarm='';localStorage.setItem('kodeks_alarm','');alarmUI();
 navigator.vibrate&&navigator.vibrate([300,150,300]);
 speak(T().msg);setTimeout(()=>alert(T().msg),300);
},1000);

$('exp').onclick=()=>{
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards)],{type:'application/json'}));
 a.download='codex_'+lang+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{const c=clean(JSON.parse(r.result));if(!c.length)throw 0;
   if(!confirm(T().replace))return;
   cards=c;save();render();quiz();dayQ();toast(T().ok)}catch(x){toast(T().bad)}
 };
 r.readAsText(f);e.target.value='';
};

$('theme').onchange=()=>{document.body.classList.toggle('light',$('theme').checked);localStorage.setItem('kodeks_theme',$('theme').checked?'light':'dark')};
if(localStorage.getItem('kodeks_theme')==='light'){document.body.classList.add('light');$('theme').checked=true}
$('lang').value=lang;
$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem('kodeks_lang',lang);cat='all';editId=null;load();ui();render();quiz();dayQ()};

let dp;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').style.display='block'});
$('inst').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('inst').style.display='none'};
addEventListener('appinstalled',()=>$('inst').style.display='none');

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

try{load();ui();render();quiz();dayQ()}catch(e){document.body.insertAdjacentHTML('afterbegin','<pre style="color:#f87171;white-space:pre-wrap">'+esc(e.message)+'</pre>')}
</script>
</body>
</html>

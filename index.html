<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16110f">
<title>Кодекс Мудрости</title>
<style>
:root{--bg:#16110f;--cd:#211a17;--bd:#3a2f2a;--tx:#f1e8d8;--sub:#a39384;--ac:#e0705f;--red:#a8322a;--in:#2a211d;--gold:#d9b36c}
.light{--bg:#f3ecdf;--cd:#fbf7ef;--bd:#ddd1bc;--tx:#2a1d18;--sub:#7a6a5c;--ac:#9e2a2b;--in:#efe6d6;--gold:#8f6218}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);margin:0 auto;padding:0 16px 80px;max-width:640px;transition:background .3s,color .3s}
.band{height:10px;margin:0 -16px;background:linear-gradient(45deg,transparent 42%,var(--red) 42% 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--red) 42% 58%,transparent 58%);background-size:10px 10px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0 8px}
h1{font:700 22px Georgia,serif;margin:0}
.hr{display:flex;gap:8px}
select,input,textarea{width:100%;padding:12px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:12px;font:16px inherit;font-family:inherit;background:var(--in);color:var(--tx)}
button{background:var(--red);color:#fff;border:0;padding:12px;width:100%;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px}
.pill{background:var(--cd);color:var(--tx);border:1px solid var(--bd);width:auto;margin:0;padding:0 12px;height:36px;border-radius:18px;font-size:13px}
.pill.rd{width:36px;padding:0;font-size:16px}
.sub{font-size:13px;color:var(--sub)}
.box{background:var(--cd);padding:16px;border-radius:16px;margin-bottom:14px;border:1px solid var(--bd)}
.box h3{margin:0 0 8px;font-size:16px}
#chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
.chip{background:transparent;color:var(--sub);border:1px solid var(--bd);padding:6px 14px;border-radius:20px;font-size:13px;white-space:nowrap;width:auto;margin:0;font-weight:500}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card{background:var(--cd);padding:18px;margin-bottom:12px;border-radius:16px;border:1px solid var(--bd);position:relative}
.card h3{margin:0 0 8px;font:700 17px Georgia,serif;padding-right:30px}
.card p{margin:0;font:15px/1.6 Georgia,serif;white-space:pre-line}
.au{font-size:13px;color:var(--sub);margin-top:8px}
.tag{display:inline-block;color:var(--gold);font-size:12px;font-weight:600;margin-bottom:6px}
.fav{position:absolute;top:14px;right:14px;background:none;width:auto;font-size:20px;padding:0;margin:0}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tb{background:transparent;border:1px solid var(--bd);color:var(--tx);margin:0;padding:6px 12px;font-size:14px;width:auto;border-radius:8px}
.tb.del{color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);z-index:10;max-width:640px;margin:auto;padding:8px 0 env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--sub);border-radius:0;margin:0;padding:6px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:11px;font-weight:500}
nav button.on{color:var(--gold)}
body:not([data-tab=thoughts]) [data-t=thoughts],
body:not([data-tab=books]) [data-t=books],
body:not([data-tab=diary]) [data-t=diary] {display:none!important}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#toast.s{opacity:1}
</style>
</head>
<body data-tab="thoughts">
<div class="band"></div>
<header>
  <h1 id="t_title">Кодекс Мудрости</h1>
  <div class="hr">
    <button class="pill" id="langb">ru / tm</button>
    <button class="pill rd" id="themeb">🌙</button>
  </div>
</header>
<div class="sub" id="meta" style="margin-bottom:12px">Личное пространство для чтения и мыслей</div>

<!-- ВЫ ВКЛАДКА: МЫСЛИ И БАЗА ЗНАНИЙ -->
<div data-t="thoughts">
  <input type="text" id="q" placeholder="🔍 Поиск по мыслям...">
  <div id="chips"></div>

  <div class="box">
    <h3 id="t_add">🚀 Добавить мысль или цитату</h3>
    <input type="text" id="title" placeholder="Тема или название...">
    <input type="text" id="author" placeholder="Автор...">
    <textarea id="advice" rows="3" placeholder="Текст мысли, инсайт..."></textarea>
    <select id="cat"></select>
    <button id="save">💾 Сохранить</button>
  </div>

  <div style="display:flex; gap:8px; margin-bottom:14px">
    <button class="tb" id="exp" style="flex:1">📥 Экспорт бэкапа (JSON)</button>
    <button class="tb" id="imp" style="flex:1">📤 Загрузить файл</button>
    <input type="file" id="file" accept=".json" style="display:none">
  </div>

  <div id="list"></div>
</div>

<!-- ВЫ ВКЛАДКА: КНИГИ -->
<div data-t="books">
  <div class="box">
    <h3>📚 Моя библиотека (.txt)</h3>
    <p class="sub">Загружай книги для чтения в спокойной обстановке без лишнего шума.</p>
    <button class="tb" id="badd" style="width:100%; margin-top:6px">➕ Загрузить книгу (.txt)</button>
    <input type="file" id="bfile" accept=".txt,text/plain" style="display:none">
  </div>
  <div id="blist"></div>
</div>

<!-- ВЫ ВКЛАДКА: ДНЕВНИК / РЕФЛЕКСИЯ -->
<div data-t="diary">
  <div class="box">
    <h3>🤫 Дневник тишины и фокуса</h3>
    <p class="sub">Фиксируй внутреннее состояние, уровень спокойствия и важные мысли за день.</p>
    <textarea id="dnote" rows="4" placeholder="Как прошел день? Какие инсайты вынес?"></textarea>
    <button id="dok">✅ Записать итог дня</button>
  </div>
  <div id="dlist"></div>
</div>

<nav id="nav">
  <button data-tab="thoughts" class="on">📜<span>Мысли</span></button>
  <button data-tab="books">📚<span>Книги</span></button>
  <button data-tab="diary">🤫<span>Дневник</span></button>
</nav>

<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const CATS=['Общие','Тишина','Психология','Стратегия','Философия','Личное'];
let lang = localStorage.getItem('kodeks_lang') || 'ru';
let theme = localStorage.getItem('kodeks_theme') || 'dark';
let cat = 'all';
let cards = JSON.parse(localStorage.getItem('kodeks_cards')) || [
  {id:1, title:'Контроль речи', author:'Юсуп', advice:'Слово — серебро, молчание — золото. Прежде чем сказать лишнее, спроси себя: улучшит ли это тишину?', category:'Тишина', fav:true},
  {id:2, title:'Антихрупкость', author:'Нассим Талеб', advice:'Некоторые вещи от беспорядка портятся, но есть те, что от ударов и хаоса становятся только крепче.', category:'Общие', fav:false}
];
let books = JSON.parse(localStorage.getItem('kodeks_books')) || [];
let diary = JSON.parse(localStorage.getItem('kodeks_diary')) || [];

if(theme==='light') document.body.classList.add('light');

function toast(m){
  const t=$('toast'); t.textContent=m; t.classList.add('s');
  clearTimeout(t.h); t.h=setTimeout(()=>t.classList.remove('s'),2000);
}

// Переключение вклаdek
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.body.dataset.tab=b.dataset.tab;
  }
});

// Переключение тем
$('themeb').onclick=()=>{
  document.body.classList.toggle('light');
  theme = document.body.classList.contains('light') ? 'light' : 'dark';
  localStorage.setItem('kodeks_theme', theme);
};

// Рендер мыслей
function renderThoughts(){
  const q = $('q').value.toLowerCase();
  $('cat').innerHTML = CATS.map(c=>`<option value="${c}">${c}</option>`).join('');
  $('chips').innerHTML = `
    <button class="chip ${cat==='all'?'on':''}" onclick="setCat('all')">Все</button>
    <button class="chip ${cat==='fav'?'on':''}" onclick="setCat('fav')">⭐ Избранное</button>
    ${CATS.map(c=>`<button class="chip ${cat===c?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
  `;

  const filtered = cards.filter(c=>(c.title+c.advice+c.author).toLowerCase().includes(q) && (cat==='all'||(cat==='fav'?c.fav:c.category===cat)));
  
  $('list').innerHTML = filtered.map(c=>`
    <div class="card">
      <button class="fav" onclick="toggleFav(${c.id})">${c.fav?'⭐':'☆'}</button>
      <span class="tag">${c.category}</span>
      <h3>📜 ${c.title}</h3>
      <p>${c.advice}</p>
      ${c.author?`<div class="au">— ${c.author}</div>`:''}
      <div class="row">
        <button class="tb" onclick="navigator.clipboard.writeText('${c.advice.replace(/'/g,"\\'")}')">📋 Копировать</button>
        <button class="tb del" onclick="delCard(${c.id})">🗑 Удалить</button>
      </div>
    </div>
  `).join('') || '<p class="sub">Ничего не найдено</p>';
}

window.setCat = c => { cat = c; renderThoughts(); };
window.toggleFav = id => {
  cards = cards.map(c=>c.id===id?{...c, fav:!c.fav}:c);
  localStorage.setItem('kodeks_cards', JSON.stringify(cards));
  renderThoughts();
};
window.delCard = id => {
  if(confirm('Удалить мысль?')) {
    cards = cards.filter(c=>c.id!==id);
    localStorage.setItem('kodeks_cards', JSON.stringify(cards));
    renderThoughts();
  }
};

$('save').onclick=()=>{
  const title=$('title').value.trim();
  const author=$('author').value.trim();
  const advice=$('advice').value.trim();
  const category=$('cat').value;
  if(!title || !advice) return toast('Заполни тему и текст!');
  
  cards.unshift({id:Date.now(), title, author, advice, category, fav:false});
  localStorage.setItem('kodeks_cards', JSON.stringify(cards));
  $('title').value=''; $('author').value=''; $('advice').value='';
  renderThoughts();
  toast('Сохранено в базу ✅');
};

$('q').oninput = renderThoughts;

// Бэкап (Экспорт / Импорт)
$('exp').onclick=()=>{
  const data = JSON.stringify({cards, books, diary}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `kodex_backup_${Date.now()}.json`;
  a.click();
  toast('Бэкап скачан 💾');
};

$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(d.cards) cards=d.cards;
      if(d.books) books=d.books;
      if(d.diary) diary=d.diary;
      localStorage.setItem('kodeks_cards', JSON.stringify(cards));
      localStorage.setItem('kodeks_books', JSON.stringify(books));
      localStorage.setItem('kodeks_diary', JSON.stringify(diary));
      renderThoughts(); renderBooks(); renderDiary();
      toast('Данные успешно загружены!');
    }catch(err){toast('Ошибка чтения файла')}
  };
  r.readAsText(f);
};

// Книги
$('badd').onclick=()=>$('bfile').click();
$('bfile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    books.unshift({id:Date.now(), name:f.name, text:ev.target.result});
    localStorage.setItem('kodeks_books', JSON.stringify(books));
    renderBooks();
    toast('Книга добавлена 📚');
  };
  r.readAsText(f);
};

function renderBooks(){
  $('blist').innerHTML = books.map(b=>`
    <div class="card">
      <h3>📖 ${b.name}</h3>
      <p class="sub">${b.text.slice(0, 120)}...</p>
      <div class="row">
        <button class="tb" onclick="readBook(${b.id})">👁 Читать</button>
        <button class="tb del" onclick="delBook(${b.id})">🗑 Удалить</button>
      </div>
    </div>
  `).join('') || '<p class="sub" style="margin-top:12px">Пока нет загруженных книг. Добавь текстовый файл.</p>';
}

window.delBook = id => {
  books = books.filter(b=>b.id!==id);
  localStorage.setItem('kodeks_books', JSON.stringify(books));
  renderBooks();
};

window.readBook = id => {
  const b = books.find(x=>x.id===id);
  if(!b) return;
  const w = window.open();
  w.document.write(`<pre style="font-family:Georgia,serif; font-size:18px; line-height:1.6; padding:20px; background:#16110f; color:#f1e8d8; white-space:pre-wrap;">${b.text}</pre>`);
};

// Дневник
$('dok').onclick=()=>{
  const text=$('dnote').value.trim();
  if(!text) return;
  diary.unshift({id:Date.now(), date:new Date().toLocaleDateString(), text});
  localStorage.setItem('kodeks_diary', JSON.stringify(diary));
  $('dnote').value='';
  renderDiary();
  toast('Записано в дневник 🤫');
};

function renderDiary(){
  $('dlist').innerHTML = diary.map(d=>`
    <div class="card">
      <span class="tag">📅 ${d.date}</span>
      <p>${d.text}</p>
    </div>
  `).join('') || '<p class="sub" style="margin-top:12px">Записей пока нет.</p>';
}

// Инициализация
renderThoughts();
renderBooks();
renderDiary();
</script>
</body>
</html>

 $('list').innerHTML=f.map(c=>`<div class="card" data-id="${c.id}"><button class="fav" data-a="fav">${c.fav?'⭐':'☆'}</button><span class="tag">${esc(t.cats[c.category])}</span><h3>📜 ${esc(c.title)}</h3><p>${esc(c.advice)}</p>${c.author?`<div class="au">— ${esc(c.author)}</div>`:''}<div class="row"><button class="tb sp" data-a="speak">🔊</button><button class="tb" data-a="copy">📋</button><button class="tb sh" data-a="share">📤</button><button class="tb" data-a="img">🖼</button><button class="tb ed" data-a="edit">✏️</button><button class="tb del" data-a="del">🗑</button></div></div>`).join('')||`<p class="sub">${t.empty}</p>`;
}
$('list').onclick=e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;
 const c=cards.find(x=>x.id==b.closest('.card').dataset.id);if(!c)return;
 const a=b.dataset.a,txt=c.title+'\n\n'+c.advice+(c.author?'\n— '+c.author:'');
 if(a==='fav'){c.fav=!c.fav;save();render()}
 else if(a==='del'){if(confirm(T().delQ)){cards=cards.filter(x=>x!==c);save();render();quiz();rv()}}
 else if(a==='edit'){editId=c.id;$('title').value=c.title;$('author').value=c.author;$('advice').value=c.advice;$('cat').value=c.category;$('save').textContent=T().upd;$('form').scrollIntoView({behavior:'smooth'})}
 else if(a==='img')quoteImg(c);
 else if(a==='copy')copy(txt);

 else speak(c.advice);

$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;document.querySelectorAll('#chips .chip').forEach(x=>x.classList.toggle('on',x===b));render()};
$('q').oninput=render;

$('save').onclick=()=>{
 const title=$('title').value.trim(),advice=$('advice').value.trim();
 if(!title||!advice)return toast(T().fill);
 const o={title,author:$('author').value.trim(),advice,category:$('cat').value};
 if(editId){const c=cards.find(x=>x.id===editId);if(c)Object.assign(c,o);editId=null}
 else cards.unshift({id:Date.now(),fav:false,lv:0,seen:0,...o});
 save();['title','author','advice'].forEach(i=>$(i).value='');$('save').textContent=T().save;render();quiz();dayQ();rv();
};

function dayQ(){
 if(!cards.length)return;
 const c=cards[Math.floor(Date.now()/864e5)%cards.length];
 $('dq').innerHTML='“'+esc(c.advice)+'”<div class="by">— '+esc(c.author||c.title)+'</div>';
}
function quiz(){
 const pool=cards.filter(c=>c.author),au=[...new Set(pool.map(c=>c.author))];
 $('quiz').style.display=au.length<3?'none':'';if(au.length<3)return;
 const c=pool[Math.random()*pool.length|0];qa=c.author;
 $('qq').textContent=c.advice;
 const o=[qa,...au.filter(a=>a!==qa).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
 $('qo').innerHTML=o.map(a=>`<button class="qb" data-v="${esc(a)}">${esc(a)}</button>`).join('');
}
$('qo').onclick=e=>{
 const b=e.target.closest('.qb');if(!b)return;
 if(b.dataset.v===qa){score+=10;localStorage.setItem('kodeks_score',score);toast(T().right)}else toast(T().wrong+qa);
 $('sc').textContent=T().score+score;quiz();
};

function alarmUI(){
 const t=T();$('abtn').textContent=alarm?t.off:t.on;$('abtn').classList.toggle('off',!!alarm);
 $('ast').textContent=alarm?t.st1+alarm+' ⏰':t.st0;$('ast').style.color=alarm?'var(--gold)':'var(--sub)';
 if(alarm)$('atime').value=alarm;
}
$('abtn').onclick=()=>{
 if(alarm)alarm='';else{if(!$('atime').value)return toast(T().pick);alarm=$('atime').value}
 localStorage.setItem('kodeks_alarm',alarm);alarmUI();
};
setInterval(()=>{
 if(!alarm)return;
 const d=new Date(),n=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 if(n!==alarm)return;
 alarm='';localStorage.setItem('kodeks_alarm','');alarmUI();
 navigator.vibrate&&navigator.vibrate([300,150,300]);
 speak(T().msg);setTimeout(()=>alert(T().msg),300);
},1000);

$('exp').onclick=async()=>{
 const b=new Blob([JSON.stringify({v:2,cards,diary})],{type:'application/json'}),f=new File([b],'codex_'+lang+'.json',{type:'application/json'}),ok=()=>{localStorage.setItem('kodeks_bk',Date.now());net()};
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});ok();return}catch(e){if(e.name==='AbortError')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();ok();setTimeout(()=>URL.revokeObjectURL(a.href),5000);

$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{const j=JSON.parse(r.result),c=clean(Array.isArray(j)?j:j.cards);if(!c.length)throw 0;
   if(!confirm(T().replace))return;
   cards=c;save();if(j.diary&&typeof j.diary==='object'&&!Array.isArray(j.diary)){diary=j.diary;saveD()}render();quiz();dayQ();diaryUI();rv();toast(T().ok)}catch(x){toast(T().bad)}
 };
 r.readAsText(f);e.target.value='';

function setTheme(l){document.body.classList.toggle('light',l);$('themeb').textContent=l?'🌙':'☀️';document.querySelector('meta[name=theme-color]').content=l?'#f3ecdf':'#16110f'}
$('themeb').onclick=()=>{const l=!document.body.classList.contains('light');localStorage.setItem('kodeks_theme',l?'light':'dark');setTheme(l)};
const th=localStorage.getItem('kodeks_theme');setTheme(th?th==='light':matchMedia('(prefers-color-scheme: light)').matches);
let st=+localStorage.getItem('kodeks_streak')||0;
{const last=localStorage.getItem('kodeks_last'),td=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
if(last!==td){st=last===y?st+1:1;localStorage.setItem('kodeks_streak',st);localStorage.setItem('kodeks_last',td)}}
$('langb').textContent=lang.toUpperCase();
$('langb').onclick=()=>{lang=lang==='ru'?'tm':'ru';$('langb').textContent=lang.toUpperCase();localStorage.setItem('kodeks_lang',lang);cat='all';editId=null;load();ui();render();quiz();dayQ()};

let dp;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').style.display='block'});
$('inst').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('inst').style.display='none'};
addEventListener('appinstalled',()=>$('inst').style.display='none');

if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

let diary={};try{diary=JSON.parse(localStorage.getItem('kodeks_diary'))||{}}catch(e){}
const saveD=()=>localStorage.setItem('kodeks_diary',JSON.stringify(diary));
const p2=n=>String(n).padStart(2,'0'),dk=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function uiX(){const t=T();$('t_di').textContent=t.dt;$('t_did').textContent=t.dd;$('dok').textContent=t.dok;$('dbad').textContent=t.dbad;$('dnote').placeholder=t.dnote;$('t_rev').textContent=t.rt;$('rshow').textContent=t.rshow;$('rok').textContent=t.rok;$('rno').textContent=t.rno;$('ical').textContent=t.ical;$('t_lib').textContent=t.lib;$('t_libd').textContent=t.libd;$('badd').textContent=t.badd;bookUI();document.querySelectorAll('#nav span').forEach((x,i)=>x.textContent=t['n'+(i+1)]);$('t_dtg').textContent=t.dtg}
let dsel=new Set();
function tagsUI(){const g=T().gl;$('dtags').innerHTML=Object.keys(g).map(k=>`<button class="chip${dsel.has(k)?' on':''}" data-k="${k}">${g[k]}</button>`).join('')}
$('dtags').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;dsel.has(k)?dsel.delete(k):dsel.add(k);tagsUI()};
function diaryUI(){
 let ok=0,h='';
 for(let i=13;i>=0;i--){const e=diary[dk(new Date(Date.now()-i*864e5))];if(e&&e.r)ok++;h+='<i class="dot'+(e?(e.r?' g':' r'):'')+(i?'':' td')+'"></i>'}
 $('dstrip').innerHTML=h;$('dstat').textContent=T().dstat.replace('{n}',ok);
 const e=diary[dk(new Date())];$('dnote').value=e&&e.n?e.n:'';dsel=new Set(e&&e.g?e.g:[]);tagsUI();
 const cnt={};let sl=0;
 for(let i=0;i<30;i++){const x=diary[dk(new Date(Date.now()-i*864e5))];if(x&&!x.r){sl++;(x.g||[]).forEach(k=>cnt[k]=(cnt[k]||0)+1)}}
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>(T().gl[k]||k)+' ('+v+')').join(', ');
 $('dins').textContent=sl?T().dins.replace('{n}',sl)+(top?' '+T().dtop+' '+top:''):'';
}
function mark(r){diary[dk(new Date())]={r,n:$('dnote').value.trim(),g:[...dsel]};saveD();diaryUI();toast(r?T().dgood:T().dslip)}
$('dok').onclick=()=>mark(1);$('dbad').onclick=()=>mark(0);

const IV=[0,1,3,7,14,30];let rc=null;
const due=c=>c.seen+IV[c.lv]*864e5;
function rv(){
 const n=Date.now(),d=cards.filter(c=>due(c)<=n).sort((a,b)=>due(a)-due(b));
 rc=d[0]||null;
 $('rcnt').textContent=T().rleft+d.length;$('rq').textContent=rc?rc.title:T().rdone;
 $('rshow').style.display=rc?'block':'none';$('rans').style.display='none';$('rbtns').style.display='none';
}
$('rshow').onclick=()=>{if(!rc)return;$('rans').textContent=rc.advice+(rc.author?'\n— '+rc.author:'');$('rans').style.display='block';$('rshow').style.display='none';$('rbtns').style.display='flex'};
$('rok').onclick=()=>{if(!rc)return;rc.lv=Math.min(rc.lv+1,5);rc.seen=Date.now();save();rv()};
$('rno').onclick=()=>{if(!rc)return;rc.lv=0;rc.seen=Date.now();save();rv()};

$('ical').onclick=()=>{
 const v=$('atime').value;if(!v)return toast(T().pick);
 const [h,m]=v.split(':'),d=new Date();
 const x=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kodeks//RU','BEGIN:VEVENT','UID:kodeks-'+Date.now()+'@kodeks','DTSTAMP:'+new Date().toISOString().replace(/[-:]|\.\d+/g,''),'DTSTART:'+d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+'T'+h+m+'00','DURATION:PT10M','RRULE:FREQ=DAILY','SUMMARY:'+T().msg.replace(/[,;]/g,' '),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Kodeks','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/calendar'}));a.download='kodeks.ics';a.click();
};

function wrap(g,t,w){const o=[];let l='';for(const k of t.split(/\s+/)){const x=l?l+' '+k:k;if(g.measureText(x).width>w&&l){o.push(l);l=k}else l=x}if(l)o.push(l);return o}
function quoteImg(c){
 const W=1080,H=1920,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
 g.fillStyle='#16110f';g.fillRect(0,0,W,H);g.fillStyle='#a8322a';
 for(const y of [60,H-100])for(let x=30;x<W+40;x+=60){g.beginPath();g.moveTo(x,y);g.lineTo(x+20,y+20);g.lineTo(x,y+40);g.lineTo(x-20,y+20);g.fill()}
 const txt='“'+c.advice+'”';let fs=76,ln;
 for(;fs>34;fs-=4){g.font='italic '+fs+'px Georgia,serif';ln=wrap(g,txt,W-200);if(ln.length*fs*1.4<H-700)break}
 g.fillStyle='#f1e8d8';g.textAlign='center';
 let y=(H-ln.length*fs*1.4)/2;ln.forEach(l=>g.fillText(l,W/2,y+=fs*1.4));
 g.font='40px sans-serif';g.fillStyle='#d9b36c';g.fillText('— '+(c.author||c.title),W/2,y+110);
 g.font='30px sans-serif';g.fillStyle='#a39384';g.fillText(T().title,W/2,H-170);
 cv.toBlob(async b=>{
  const f=new File([b],'mysl.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mysl.png';a.click();toast(T().saved);
 },'image/png');
}

const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('kodeks',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>ok(r.result);r.onerror=no});
const idbSet=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('t','readwrite');t.objectStore('t').put(v,k);t.oncomplete=ok;t.onerror=no})};
const idbGet=async k=>{const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('t').objectStore('t').get(k);q.onsuccess=()=>ok(q.result);q.onerror=no})};
const idbDel=async k=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('t','readwrite');t.objectStore('t').delete(k);t.oncomplete=ok})};
let books=[];try{books=JSON.parse(localStorage.getItem('kodeks_books'))||[]}catch(e){}
const saveB=()=>localStorage.setItem('kodeks_books',JSON.stringify(books));
const detect=t=>{const x=t.slice(0,3000),cy=(x.match(/[а-яё]/gi)||[]).length;return cy>x.length*.3?'ru-RU':/[ýňžş]/i.test(x)?'tr-TR':'en-US'};
function split(t){const o=[];t.split(/\n+/).forEach(p=>{p=p.trim();if(!p)return;(p.match(/[^.!?…]+[.!?…]+["»”)]*\s*|[^.!?…]+$/g)||[p]).forEach(s=>{s=s.trim();while(s.length>260){let k=s.lastIndexOf(' ',260);if(k<80)k=260;o.push(s.slice(0,k)+' ');s=s.slice(k).trim()}if(s)o.push(s+' ')});o[o.length-1]=o[o.length-1].trim()+'\n\n'});return o}
function bookUI(){$('blist').innerHTML=books.map(b=>`<div class="bi" data-id="${b.id}"><div><b>${esc(b.title)}</b><div class="sub">${Math.round(b.pos/Math.max(b.n,1)*100)}% · ${b.lang}</div></div><div class="row" style="margin:0"><button class="tb" data-a="open">▶</button><button class="tb del" data-a="bdel">🗑</button></div></div>`).join('')||`<div class="sub">${T().bempty}</div>`}
$('badd').onclick=()=>$('bfile').click();
$('bfile').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const buf=await f.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(x){t=new TextDecoder('windows-1251').decode(buf)}
  t=t.replace(/\r/g,'').trim();if(t.length<50)throw 0;
  const id=Date.now();await idbSet(id,t);books.unshift({id,title:f.name.replace(/\.[^.]+$/,''),lang:detect(t),n:split(t).length,pos:0});saveB();bookUI();toast(T().ok)}catch(x){toast(T().bad)}
};
$('blist').onclick=e=>{
 const b=e.target.closest('button[data-a]');if(!b)return;const id=+b.closest('.bi').dataset.id;
 if(b.dataset.a==='open')openBook(id);else if(confirm(T().delQ)){books=books.filter(x=>x.id!==id);saveB();idbDel(id);bookUI()}
};
let bk=null,ch=[],ci=0,pg=-1,playing=false,cur=null,rate=1,wl=null;const PG=10;
async function openBook(id){
 bk=books.find(b=>b.id===id);const t=await idbGet(id);if(!t)return toast(T().bad);
 ch=split(t);bk.n=ch.length;ci=Math.min(bk.pos,ch.length-1);pg=-1;
 $('rd').hidden=false;$('rtitle').textContent=bk.title;$('rseek').max=ch.length-1;showPage();
}
function showPage(){
 const s=ci-ci%PG,r=$('rtxt');
 if(s!==pg){pg=s;r.innerHTML=ch.slice(s,s+PG).map((c,j)=>`<span data-i="${s+j}">${esc(c)}</span>`).join('');r.scrollTop=0}
 r.querySelectorAll('.cur').forEach(x=>x.classList.remove('cur'));
 const e=r.querySelector('[data-i="'+ci+'"]');if(e){e.classList.add('cur');if(playing)e.scrollIntoView({block:'nearest'})}
 $('rseek').value=ci;$('rpct').textContent=Math.round(ci/ch.length*100)+'%';$('rplay').textContent=playing?'⏸':'▶';
}
function say(){
 speechSynthesis.cancel();if(!playing)return;
 const u=new SpeechSynthesisUtterance(ch[ci].trim());u.lang=bk.lang;u.rate=rate;
 u.onend=()=>{if(cur!==u||!playing)return;if(ci<ch.length-1){ci++;bk.pos=ci;saveB();showPage();say()}else{playing=false;showPage()}};
 cur=u;speechSynthesis.speak(u);
}
function go(i){ci=Math.max(0,Math.min(ch.length-1,i));bk.pos=ci;saveB();showPage();if(playing)say()}
async function lock(on){try{if(on)wl=await navigator.wakeLock.request('screen');else if(wl){wl.release();wl=null}}catch(e){}}
$('rplay').onclick=()=>{if(!('speechSynthesis' in window))return toast('⚠️');playing=!playing;if(playing)say();else speechSynthesis.cancel();lock(playing);showPage()};
$('rprev').onclick=()=>go(ci-1);$('rnext').onclick=()=>go(ci+1);
$('rpp').onclick=()=>go(ci-ci%PG-PG);$('rpn').onclick=()=>go(ci-ci%PG+PG);
$('rsave').onclick=()=>{const t=ch[ci].trim();cards.unshift({id:Date.now(),title:t.length>40?t.slice(0,38)+'…':t,author:bk.title,advice:t,category:'Общие',fav:false,lv:0,seen:0});save();render();rv();toast(T().saved2)};
$('rseek').onchange=()=>go(+$('rseek').value);
$('rrate').onchange=()=>{rate=+$('rrate').value;if(playing)say()};
$('rtxt').onclick=e=>{const x=e.target.closest('[data-i]');if(x)go(+x.dataset.i)};
$('rclose').onclick=()=>{playing=false;speechSynthesis.cancel();lock(false);$('rd').hidden=true;bookUI()};

function setTab(t){document.body.dataset.tab=t;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));localStorage.setItem('kodeks_tab',t);scrollTo(0,0)}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};
{const t=localStorage.getItem('kodeks_tab');setTab(['today','thoughts','books','diary'].includes(t)?t:'today')}

try{load();ui();render();quiz();dayQ()}catch(e){document.body.insertAdjacentHTML('afterbegin','<pre style="color:#f87171;white-space:pre-wrap">'+esc(e.message)+'</pre>')}
